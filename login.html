<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>simple login · demo</title>
  <style>
    /* reset & base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: linear-gradient(145deg, #f5f7fb 0%, #e9eef4 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* card */
    .login-card {
      background: #ffffff;
      max-width: 420px;
      width: 100%;
      padding: 2.5rem 2rem 2.2rem;
      border-radius: 2rem;
      box-shadow: 0 18px 30px -12px rgba(0, 20, 30, 0.2),
                  0 4px 12px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.7);
      transition: transform 0.2s ease;
    }

    .login-card:hover {
      transform: scale(1.01);
    }

    /* heading */
    .login-card h2 {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #1a2b3c;
      margin-bottom: 0.25rem;
    }

    .login-card .subhead {
      font-size: 0.95rem;
      color: #6a7e8e;
      margin-bottom: 2rem;
      border-left: 3px solid #3b82f6;
      padding-left: 0.9rem;
    }

    /* form fields */
    .field {
      margin-bottom: 1.5rem;
    }

    .field label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #2d4051;
      margin-bottom: 0.45rem;
    }

    .field input {
      width: 100%;
      padding: 0.9rem 1.2rem;
      font-size: 1rem;
      background: #f8fafd;
      border: 1.5px solid #dee6ed;
      border-radius: 1.2rem;
      transition: all 0.2s ease;
      outline: none;
      color: #0e1c26;
    }

    .field input:focus {
      border-color: #3b82f6;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
    }

    .field input::placeholder {
      color: #9aaebd;
      font-weight: 300;
      font-size: 0.95rem;
    }

    /* forgot password */
    .forgot-row {
      display: flex;
      justify-content: flex-end;
      margin-top: -0.3rem;
      margin-bottom: 1.8rem;
    }

    .forgot-row a {
      font-size: 0.85rem;
      color: #3b82f6;
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px dashed rgba(59, 130, 246, 0.4);
      transition: border-color 0.15s;
    }

    .forgot-row a:hover {
      border-bottom-color: #3b82f6;
      color: #1e5bbf;
    }

    /* login button */
    .login-btn {
      width: 100%;
      padding: 1rem 0;
      font-size: 1.1rem;
      font-weight: 600;
      color: white;
      background: #1f2f3e;
      border: none;
      border-radius: 3rem;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
      letter-spacing: 0.01em;
      box-shadow: 0 10px 20px -8px rgba(0, 0, 0, 0.25);
      margin-bottom: 1.6rem;
    }

    .login-btn:hover {
      background: #111f2b;
      box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.35);
    }

    .login-btn:active {
      transform: scale(0.97);
      box-shadow: 0 5px 12px -6px rgba(0, 0, 0, 0.3);
    }

    /* signup suggestion */
    .signup-text {
      text-align: center;
      font-size: 0.9rem;
      color: #6c8394;
      border-top: 1px solid #e5ecf2;
      padding-top: 1.5rem;
      margin-top: 0.2rem;
    }

    .signup-text a {
      color: #1f2f3e;
      font-weight: 600;
      text-decoration: none;
      margin-left: 0.25rem;
      border-bottom: 1.5px solid transparent;
      transition: border-color 0.2s;
    }

    .signup-text a:hover {
      border-bottom-color: #1f2f3e;
    }

    /* tiny demo note (non-intrusive) */
    .demo-note {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #b2c4d2;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Welcome back</h2>
    <div class="subhead">sign in to continue</div>

    <!-- simple login form (no actual backend) -->
    <form action="#" method="post" onsubmit="event.preventDefault(); alert('✨ Demo login — no data sent.');">
      
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autofocus>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <div class="forgot-row">
        <a href="#" onclick="alert('🔑 This is a demo — password reset not implemented'); return false;">Forgot password?</a>
      </div>

      <button type="submit" class="login-btn">Log in</button>

      <div class="signup-text">
        Don't have an account? <a href="#" onclick="alert('📝 Demo signup — no action'); return false;">Sign up</a>
      </div>

      <div class="demo-note">
        ⚡ demo · no actual authentication
      </div>
    </form>
  </div>

</body>
</html>
